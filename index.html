<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocConvert</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap');

  :root {
    --bg: #0e0e10;
    --surface: #1a1a1f;
    --border: #2e2e38;
    --accent: #00e5a0;
    --accent2: #0099ff;
    --text: #e8e8ee;
    --muted: #7a7a8e;
    --danger: #ff4466;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans KR', sans-serif;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #0e0e10 0%, #1a1a2e 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 17px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-left: 42px;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Main */
  main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  /* Drop Zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }

  .drop-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,229,160,0.03), rgba(0,153,255,0.03));
    opacity: 0;
    transition: opacity 0.25s;
  }

  .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(0,229,160,0.05);
  }

  .drop-zone.drag-over::before { opacity: 1; }

  .drop-icon { font-size: 40px; margin-bottom: 12px; display: block; }

  .drop-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text);
  }

  .drop-sub {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  .file-types {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .badge-html { background: rgba(255,102,0,0.15); color: #ff6600; border: 1px solid rgba(255,102,0,0.3); }
  .badge-word { background: rgba(0,102,255,0.15); color: #4499ff; border: 1px solid rgba(0,102,255,0.3); }
  .badge-pdf  { background: rgba(255,30,60,0.15);  color: #ff4466; border: 1px solid rgba(255,30,60,0.3); }
  .badge-txt  { background: rgba(0,229,160,0.15); color: var(--accent); border: 1px solid rgba(0,229,160,0.3); }

  #fileInput { display: none; }

  /* File list */
  .file-list { display: flex; flex-direction: column; gap: 8px; }

  .file-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.2s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .file-icon { font-size: 22px; flex-shrink: 0; }

  .file-info { flex: 1; min-width: 0; }

  .file-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-meta {
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 2px;
  }

  .file-status {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .status-ready   { background: rgba(0,229,160,0.15); color: var(--accent); }
  .status-loading { background: rgba(255,200,0,0.15);  color: #ffcc00; }
  .status-done    { background: rgba(0,153,255,0.15);  color: var(--accent2); }
  .status-error   { background: rgba(255,68,102,0.15); color: var(--danger); }

  .remove-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    flex-shrink: 0;
    transition: color 0.2s;
  }

  .remove-btn:hover { color: var(--danger); }

  /* Options */
  .options-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
  }

  .options-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .option-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }

  .option-row:last-child { border-bottom: none; }

  .option-label { font-size: 13px; }
  .option-desc  { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Toggle */
  .toggle {
    position: relative;
    width: 44px; height: 24px;
    flex-shrink: 0;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--border);
    border-radius: 24px;
    cursor: pointer;
    transition: 0.3s;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: 0.3s;
  }

  .toggle input:checked + .toggle-slider { background: var(--accent); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

  /* Convert button */
  .convert-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: #000;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    padding: 16px;
    border-radius: 14px;
    cursor: pointer;
    width: 100%;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .convert-btn:active { transform: scale(0.98); }
  .convert-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Result */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .result-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .result-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }

  .result-actions { display: flex; gap: 8px; }

  .action-btn {
    background: var(--border);
    border: none;
    color: var(--text);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .action-btn:hover { background: #3a3a48; }
  .action-btn.copied { background: rgba(0,229,160,0.2); color: var(--accent); }

  .result-body {
    padding: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #c8c8d8;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
    background: #0a0a0d;
  }

  .result-body::-webkit-scrollbar { width: 4px; }
  .result-body::-webkit-scrollbar-track { background: transparent; }
  .result-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Stats bar */
  .stats-bar {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .stat-item span { color: var(--text); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #000;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 24px;
    z-index: 999;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Progress bar */
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 6px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }

  .tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    border-radius: 7px;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--muted);
    transition: all 0.2s;
    font-family: 'IBM Plex Sans KR', sans-serif;
  }

  .tab.active {
    background: linear-gradient(135deg, rgba(0,229,160,0.2), rgba(0,153,255,0.2));
    color: var(--text);
    border: 1px solid rgba(0,229,160,0.3);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
  }

  .empty-icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">📄</div>
    <h1>DocConvert</h1>
  </div>
  <div class="subtitle">HTML · DOCX · PDF · TXT → Markdown</div>
</div>

<main>
  <!-- Drop Zone -->
  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <span class="drop-icon">⬆️</span>
    <div class="drop-title">파일을 탭하여 선택</div>
    <div class="drop-sub">또는 여기에 드래그 앤 드롭</div>
    <div class="file-types">
      <span class="badge badge-html">HTML</span>
      <span class="badge badge-word">DOCX</span>
      <span class="badge badge-pdf">PDF</span>
      <span class="badge badge-txt">TXT</span>
    </div>
  </div>
  <input type="file" id="fileInput" multiple accept=".html,.htm,.docx,.doc,.pdf,.txt,.md">

  <!-- File List -->
  <div class="file-list" id="fileList"></div>

  <!-- Options -->
  <div class="options-card">
    <div class="options-title">변환 옵션</div>
    <div class="option-row">
      <div>
        <div class="option-label">헤딩 구조 유지</div>
        <div class="option-desc">H1, H2, H3 → # ## ###</div>
      </div>
      <label class="toggle"><input type="checkbox" id="optHeadings" checked><span class="toggle-slider"></span></label>
    </div>
    <div class="option-row">
      <div>
        <div class="option-label">링크 포함</div>
        <div class="option-desc">URL을 [텍스트](링크) 형식으로</div>
      </div>
      <label class="toggle"><input type="checkbox" id="optLinks" checked><span class="toggle-slider"></span></label>
    </div>
    <div class="option-row">
      <div>
        <div class="option-label">표(Table) 변환</div>
        <div class="option-desc">HTML 테이블 → Markdown 표</div>
      </div>
      <label class="toggle"><input type="checkbox" id="optTables" checked><span class="toggle-slider"></span></label>
    </div>
    <div class="option-row">
      <div>
        <div class="option-label">파일 구분자 추가</div>
        <div class="option-desc">여러 파일 병합 시 구분선 삽입</div>
      </div>
      <label class="toggle"><input type="checkbox" id="optSeparator" checked><span class="toggle-slider"></span></label>
    </div>
  </div>

  <!-- Convert Button -->
  <button class="convert-btn" id="convertBtn" onclick="convertAll()" disabled>
    <span>⚡</span> 변환 시작
  </button>

  <!-- Result Tabs -->
  <div id="resultSection" style="display:none">
    <div class="tabs" style="margin-bottom:10px">
      <button class="tab active" onclick="switchTab('preview')">👁 미리보기</button>
      <button class="tab" onclick="switchTab('raw')">{ } 원본</button>
    </div>

    <div class="result-card">
      <div class="result-header">
        <div class="result-title" id="resultTitle">결과</div>
        <div class="result-actions">
          <button class="action-btn" id="copyBtn" onclick="copyResult()">📋 복사</button>
          <button class="action-btn" onclick="downloadResult()">💾 저장</button>
        </div>
      </div>

      <div id="tabPreview" class="tab-content active">
        <div class="result-body" id="previewBody"></div>
      </div>
      <div id="tabRaw" class="tab-content">
        <div class="result-body" id="rawBody"></div>
      </div>

      <div class="stats-bar">
        <div class="stat-item">글자 <span id="statChars">0</span></div>
        <div class="stat-item">줄 <span id="statLines">0</span></div>
        <div class="stat-item">단어 <span id="statWords">0</span></div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<script>
// ─── State ───────────────────────────────────────────────
let files = [];
let resultMarkdown = '';

// ─── Drag & Drop ─────────────────────────────────────────
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  addFiles([...e.dataTransfer.files]);
});

fileInput.addEventListener('change', () => addFiles([...fileInput.files]));

// ─── File Management ─────────────────────────────────────
function addFiles(newFiles) {
  newFiles.forEach(f => {
    const ext = f.name.split('.').pop().toLowerCase();
    if (!['html','htm','docx','doc','pdf','txt','md'].includes(ext)) {
      showToast(`❌ ${f.name}: 지원하지 않는 형식`);
      return;
    }
    if (files.find(x => x.name === f.name && x.size === f.size)) return;
    files.push(f);
  });
  renderFileList();
  updateConvertBtn();
  fileInput.value = '';
}

function removeFile(idx) {
  files.splice(idx, 1);
  renderFileList();
  updateConvertBtn();
}

function getFileIcon(ext) {
  const icons = { html:'🌐', htm:'🌐', docx:'📝', doc:'📝', pdf:'📕', txt:'📄', md:'📋' };
  return icons[ext] || '📄';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + 'KB';
  return (bytes/(1024*1024)).toFixed(1) + 'MB';
}

function renderFileList() {
  const list = document.getElementById('fileList');
  list.innerHTML = files.map((f, i) => {
    const ext = f.name.split('.').pop().toLowerCase();
    return `
      <div class="file-item" id="file-${i}">
        <div class="file-icon">${getFileIcon(ext)}</div>
        <div class="file-info">
          <div class="file-name">${f.name}</div>
          <div class="file-meta">${ext.toUpperCase()} · ${formatSize(f.size)}</div>
        </div>
        <div class="file-status status-ready" id="status-${i}">대기</div>
        <button class="remove-btn" onclick="removeFile(${i})">✕</button>
      </div>
    `;
  }).join('');
}

function updateConvertBtn() {
  document.getElementById('convertBtn').disabled = files.length === 0;
}

function setStatus(idx, status, label) {
  const el = document.getElementById(`status-${idx}`);
  if (!el) return;
  el.className = `file-status status-${status}`;
  el.textContent = label;
}

// ─── Converters ──────────────────────────────────────────
function htmlToMarkdown(html) {
  const opts = {
    headings: document.getElementById('optHeadings').checked,
    links:    document.getElementById('optLinks').checked,
    tables:   document.getElementById('optTables').checked,
  };

  const doc = new DOMParser().parseFromString(html, 'text/html');

  function processNode(node) {
    if (node.nodeType === 3) return node.textContent; // text node
    if (node.nodeType !== 1) return '';

    const tag = node.tagName.toLowerCase();
    const children = () => [...node.childNodes].map(processNode).join('');

    if (opts.headings) {
      if (tag === 'h1') return `# ${children()}\n\n`;
      if (tag === 'h2') return `## ${children()}\n\n`;
      if (tag === 'h3') return `### ${children()}\n\n`;
      if (tag === 'h4') return `#### ${children()}\n\n`;
      if (tag === 'h5') return `##### ${children()}\n\n`;
      if (tag === 'h6') return `###### ${children()}\n\n`;
    }

    if (tag === 'p') return `${children()}\n\n`;
    if (tag === 'br') return '\n';
    if (tag === 'hr') return '\n---\n\n';
    if (tag === 'strong' || tag === 'b') return `**${children()}**`;
    if (tag === 'em' || tag === 'i') return `*${children()}*`;
    if (tag === 'code') return `\`${children()}\``;
    if (tag === 'pre') return `\`\`\`\n${node.textContent}\n\`\`\`\n\n`;
    if (tag === 'blockquote') return `> ${children()}\n\n`;
    if (tag === 'del' || tag === 's') return `~~${children()}~~`;

    if (opts.links && tag === 'a') {
      const href = node.getAttribute('href');
      const text = children().trim();
      if (href && href !== text && !href.startsWith('#')) return `[${text}](${href})`;
      return text;
    }

    if (tag === 'img') {
      const alt = node.getAttribute('alt') || '이미지';
      const src = node.getAttribute('src') || '';
      return `![${alt}](${src})`;
    }

    if (tag === 'ul') {
      return [...node.children].map(li => `- ${processNode(li).trim()}`).join('\n') + '\n\n';
    }
    if (tag === 'ol') {
      return [...node.children].map((li, i) => `${i+1}. ${processNode(li).trim()}`).join('\n') + '\n\n';
    }
    if (tag === 'li') return children();

    if (opts.tables && tag === 'table') {
      return tableToMarkdown(node);
    }

    const skip = ['script','style','head','nav','footer'];
    if (skip.includes(tag)) return '';

    return children();
  }

  function tableToMarkdown(table) {
    const rows = [...table.querySelectorAll('tr')];
    if (!rows.length) return '';
    const cells = rows.map(r => [...r.querySelectorAll('th,td')].map(c => c.textContent.trim().replace(/\|/g,'\\|')));
    let md = '';
    cells.forEach((row, i) => {
      md += '| ' + row.join(' | ') + ' |\n';
      if (i === 0) md += '| ' + row.map(() => '---').join(' | ') + ' |\n';
    });
    return md + '\n';
  }

  const body = doc.body || doc.documentElement;
  const title = doc.querySelector('title');
  let md = title ? `# ${title.textContent.trim()}\n\n` : '';
  md += processNode(body);
  return md.replace(/\n{3,}/g, '\n\n').trim();
}

async function docxToMarkdown(file) {
  if (typeof mammoth === 'undefined') throw new Error('mammoth 라이브러리 로드 실패');
  const buf = await file.arrayBuffer();
  const result = await mammoth.convertToHtml({ arrayBuffer: buf });
  return htmlToMarkdown(result.value);
}

async function pdfToMarkdown(file) {
  // PDF.js CDN 동적 로드
  if (!window.pdfjsLib) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let md = `# ${file.name.replace(/\.pdf$/i,'')}\n\n`;

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const lines = [];
    let lastY = null;
    content.items.forEach(item => {
      if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
        lines.push('');
      }
      if (lines.length === 0 || lines[lines.length-1] === '') {
        lines.push(item.str);
      } else {
        lines[lines.length-1] += ' ' + item.str;
      }
      lastY = item.transform[5];
    });

    if (pdf.numPages > 1) md += `## 페이지 ${p}\n\n`;
    md += lines.filter(l => l.trim()).join('\n') + '\n\n';
  }
  return md.trim();
}

function txtToMarkdown(text) {
  const lines = text.split('\n');
  let md = '';
  lines.forEach(line => {
    const t = line.trimEnd();
    // 모두 대문자 짧은 줄 → 헤딩 추측
    if (t.length > 0 && t.length < 60 && t === t.toUpperCase() && /[A-Z가-힣]/.test(t)) {
      md += `## ${t}\n\n`;
    } else {
      md += t + '\n';
    }
  });
  return md.trim();
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

// ─── Convert All ─────────────────────────────────────────
async function convertAll() {
  if (!files.length) return;

  const btn = document.getElementById('convertBtn');
  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span> 변환 중...';

  const sep = document.getElementById('optSeparator').checked;
  const parts = [];

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const ext = f.name.split('.').pop().toLowerCase();
    setStatus(i, 'loading', '변환중');

    try {
      let md = '';
      if (['html','htm'].includes(ext)) {
        const text = await f.text();
        md = htmlToMarkdown(text);
      } else if (['docx','doc'].includes(ext)) {
        md = await docxToMarkdown(f);
      } else if (ext === 'pdf') {
        md = await pdfToMarkdown(f);
      } else {
        const text = await f.text();
        md = ext === 'md' ? text : txtToMarkdown(text);
      }

      if (sep && files.length > 1) {
        md = `---\n📄 **파일: ${f.name}**\n---\n\n${md}`;
      }
      parts.push(md);
      setStatus(i, 'done', '완료 ✓');
    } catch (err) {
      setStatus(i, 'error', '오류 ✗');
      parts.push(`> ⚠️ ${f.name} 변환 실패: ${err.message}`);
    }
  }

  resultMarkdown = parts.join('\n\n---\n\n');
  showResult();

  btn.disabled = false;
  btn.innerHTML = '<span>⚡</span> 다시 변환';
  showToast('✅ 변환 완료!');
}

// ─── Result Display ───────────────────────────────────────
function showResult() {
  const section = document.getElementById('resultSection');
  section.style.display = 'block';
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });

  document.getElementById('rawBody').textContent = resultMarkdown;
  renderPreview();
  updateStats();
  document.getElementById('resultTitle').textContent =
    `결과 (${files.length}개 파일)`;
}

function renderPreview() {
  // 간단한 Markdown → HTML 렌더링
  let html = resultMarkdown
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^###### (.+)$/gm, '<h6>$1</h6>')
    .replace(/^##### (.+)$/gm,  '<h5>$1</h5>')
    .replace(/^#### (.+)$/gm,   '<h4>$1</h4>')
    .replace(/^### (.+)$/gm,    '<h3 style="color:#00e5a0;margin:12px 0 6px">$1</h3>')
    .replace(/^## (.+)$/gm,     '<h2 style="color:#4499ff;margin:14px 0 6px">$1</h2>')
    .replace(/^# (.+)$/gm,      '<h1 style="color:#fff;margin:16px 0 8px">$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,  '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,      '<em>$1</em>')
    .replace(/`(.+?)`/g,        '<code style="background:#1a1a2e;padding:1px 4px;border-radius:3px;font-family:monospace">$1</code>')
    .replace(/^---$/gm,         '<hr style="border-color:#2e2e38;margin:10px 0">')
    .replace(/^\- (.+)$/gm,     '• $1<br>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" style="color:#4499ff">$1</a>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');

  document.getElementById('previewBody').innerHTML = html;
}

function updateStats() {
  document.getElementById('statChars').textContent = resultMarkdown.length.toLocaleString();
  document.getElementById('statLines').textContent = resultMarkdown.split('\n').length.toLocaleString();
  document.getElementById('statWords').textContent = resultMarkdown.trim().split(/\s+/).length.toLocaleString();
}

// ─── Tab Switch ───────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && tab==='preview') || (i===1 && tab==='raw'));
  });
  document.getElementById('tabPreview').classList.toggle('active', tab==='preview');
  document.getElementById('tabRaw').classList.toggle('active', tab==='raw');
}

// ─── Actions ─────────────────────────────────────────────
async function copyResult() {
  try {
    await navigator.clipboard.writeText(resultMarkdown);
    const btn = document.getElementById('copyBtn');
    btn.classList.add('copied');
    btn.textContent = '✓ 복사됨';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = '📋 복사'; }, 2000);
    showToast('📋 클립보드에 복사됨');
  } catch {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = resultMarkdown;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('📋 복사됨');
  }
}

function downloadResult() {
  const baseName = files.length === 1
    ? files[0].name.replace(/\.[^.]+$/, '')
    : 'converted';
  const blob = new Blob([resultMarkdown], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${baseName}.md`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('💾 파일 저장됨');
}

// ─── Toast ────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
